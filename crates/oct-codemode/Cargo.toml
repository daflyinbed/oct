[package]
name = "oct-codemode"
version = "0.1.0"
edition = "2024"

[features]
default = []
runtime = ["dep:deno_core", "dep:deno_ast", "dep:deno_error"]

[[bin]]
name = "oct-codemode-worker"
path = "src/worker.rs"
required-features = ["runtime"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
deno_core = { version = "=0.412.0", optional = true }
deno_ast = { version = "=0.53.3", features = ["transpiling"], optional = true }
deno_error = { version = "0.7", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
