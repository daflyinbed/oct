[package]
name = "oct-agent"
version = "0.1.0"
edition = "2024"

[features]
# Integration tests that launch the separately built V8 helper.
code-mode-tests = []

[[bin]]
name = "oct-agent"
path = "src/main.rs"

[dependencies]
oct-llm-provider = { path = "../oct-llm-provider" }
oct-mcp = { path = "../oct-mcp" }
oct-codemode = { path = "../oct-codemode" }
jsonschema = { version = "0.58", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "form"] }
# Embeds the built frontend (packages/app/dist) into the binary; see api/embed.rs.
# No default features: debug builds read the folder at runtime, release builds
# bake the files in via include_bytes.
rust-embed = "8.12"
axum = "0.8"
chrono = { version = "0.4", features = [ "serde" ] }
futures-util = "0.3"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "json",
  "chrono",
  "derive",
  "macros",
  "migrate"
] }
thiserror = "2"
tokio = { version = "1", features = [ "full" ] }
tokio-stream = { version = "0.1", features = [ "sync" ] }
# 0.7 for ServeDir::with_backend + the fs::Backend trait (embedded assets get
# the full ServeDir feature set: mime, ETag/304, range requests).
tower-http = { version = "0.7", features = [
  "cors",
  "fs" 
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
utoipa = { version = "5", features = [ "axum_extras", "chrono" ] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = [ "axum" ] }
uuid = { version = "1", features = [
  "v4",
  "serde" 
] }
async-trait = "0.1"
async-stream = "0.3"
futures-core = "0.3"
dashmap = "6"
tokio-util = "0.7"
schemars = "0.8"
# OAuth 2.0 + PKCE for http-transport MCP servers (src/oauth.rs): SHA-256 for
# the S256 code challenge, base64url encoding of it, and URL parsing for the
# RFC 8414 well-known candidates / authorization URL assembly.
sha2 = "0.10"
base64 = "0.22"
url = "2"
# ripgrep-family library crates for the in-process grep/glob search tools
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
# Default database location under $XDG_DATA_HOME (db::resolve_database_url)
dirs = "7.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Manual catalog/runtime probe reads existing OpenCode JSONC configurations.
jsonc-parser = { version = "0.33", features = ["serde"] }
# sse_payloads() (reconnect e2e) reads response bodies incrementally, which
# needs reqwest's stream feature — test-only enablement.
reqwest = { version = "0.13", features = ["stream"] }
# start_paused for the tools/list_changed debounce tests: paused-clock
# auto-advance replaces sleep-based waiting ("tests forbid sleep as a sync
# primitive"). Test-only; not part of the production feature set.
tokio = { version = "1", features = ["test-util"] }
